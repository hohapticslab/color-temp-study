<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Temperature VAS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+TC:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Single fixed theme on purpose: the stimulus must render on the same
     neutral ground for every participant, regardless of OS dark mode. */
  :root {
    --ground: #8f8f8f;      /* neutral grey, L* ≈ 60 */
    --panel: #ececec;
    --panel-edge: #d6d6d6;
    --ink: #1b1b1b;
    --ink-soft: #4a4a4a;
    --ink-faint: #7a7a7a;
    --line: #1b1b1b;
    --focus: #1b1b1b;
    --sans: "Noto Sans", "Noto Sans JP", "Noto Sans TC", "Hiragino Sans", "Microsoft JhengHei", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  html[lang="ja"] { --sans: "Noto Sans JP", "Noto Sans", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; }
  html[lang="zh-Hant"] { --sans: "Noto Sans TC", "Noto Sans", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 32px 20px;
  }
  .screen { display: none; width: 100%; }
  .screen.active { display: block; }

  /* Panels for text screens */
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    max-width: 600px;
    margin: 0 auto;
    padding: 36px 40px 32px;
  }
  @media (max-width: 520px) { .panel { padding: 28px 22px 24px; } }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 8px;
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0 0 20px;
    text-wrap: balance;
  }
  p { margin: 0 0 14px; max-width: 62ch; color: var(--ink-soft); }
  p.strong { color: var(--ink); }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }

  label.field { display: block; font-size: 14px; color: var(--ink-soft); }
  label.field span { display: block; margin-bottom: 6px; }
  input[type="text"], input[type="number"], select {
    width: 100%;
    font: 500 16px var(--mono);
    padding: 10px 12px;
    border: 1px solid var(--ink-faint);
    background: #fff;
    color: var(--ink);
    border-radius: 0;
  }
  input[type="text"]:focus-visible, input[type="number"]:focus-visible, select:focus-visible, button:focus-visible, .vas:focus-visible, .lang button:focus-visible, input[type="radio"]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; color: var(--ink); cursor: pointer; }
  .check input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--ink); flex: none; }
  .radio-group { display: flex; gap: 18px; flex-wrap: wrap; }
  .radio-group label {
    display: flex; gap: 8px; align-items: center;
    font-size: 15px; color: var(--ink); cursor: pointer;
  }
  .radio-group input[type="radio"] {
    width: 18px; height: 18px; accent-color: var(--ink); flex: none; margin: 0;
  }

  button {
    font: 600 15px var(--sans);
    padding: 11px 22px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    cursor: pointer;
    border-radius: 0;
  }
  button.secondary { background: transparent; color: var(--ink); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Language chooser */
  .lang { display: grid; gap: 10px; margin-top: 8px; }
  .lang button {
    display: flex; justify-content: space-between; align-items: baseline;
    width: 100%; text-align: left;
    background: #fff; color: var(--ink); border: 1px solid var(--panel-edge);
    padding: 14px 18px; font-weight: 600; font-size: 17px;
  }
  .lang button small { font: 400 12px var(--mono); color: var(--ink-faint); letter-spacing: 0.06em; }
  .lang button:hover { border-color: var(--ink); }

  /* Persistent language switcher (top-right, visible on every screen except the initial chooser) */
  .lang-switcher {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    font-family: var(--sans);
  }
  .lang-switcher .toggle {
    display: flex; align-items: center; gap: 6px;
    font: 600 13px var(--mono);
    letter-spacing: 0.04em;
    padding: 8px 12px;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--panel-edge);
  }
  .lang-switcher .toggle:hover { border-color: var(--ink); }
  .lang-switcher .toggle .caret { font-size: 10px; opacity: 0.6; }
  .lang-menu[hidden] { display: none; }
  .lang-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    display: grid;
    min-width: 150px;
    background: #fff;
    border: 1px solid var(--panel-edge);
  }
  .lang-menu button {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; text-align: left;
    font: 500 14px var(--sans);
    padding: 10px 14px;
    background: #fff;
    color: var(--ink);
    border: none;
    border-bottom: 1px solid var(--panel-edge);
  }
  .lang-menu button:last-child { border-bottom: none; }
  .lang-menu button:hover { background: var(--panel); }
  .lang-menu button[aria-current="true"] { font-weight: 600; }
  .lang-menu button[aria-current="true"]::after { content: "✓"; font-size: 12px; }

  /* Trial screen */
  .trial {
    display: flex; flex-direction: column; align-items: center; gap: 40px;
    width: 100%; max-width: 640px; margin: 0 auto;
  }
  .counter {
    font: 500 13px var(--mono);
    letter-spacing: 0.06em;
    color: #2b2b2b;
    font-variant-numeric: tabular-nums;
    align-self: flex-start;
    min-height: 20px;
  }
  .stimulus {
    width: min(58vmin, 380px);
    height: min(58vmin, 380px);
    display: grid;
  }
  .patch { width: 100%; height: 100%; background: var(--ground); }
  .probe {
    width: 100%; height: 100%;
    display: grid; place-items: center; align-content: center; gap: 14px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    padding: 24px;
    text-align: center;
  }
  .probe-prompt {
    font-size: 13px; font-weight: 400; color: var(--ink-faint);
    letter-spacing: 0.02em; white-space: pre-line;   /* honours \n in probePrompt */
  }
  .probe-text {
    font-size: clamp(19px, 3.4vmin, 26px); font-weight: 600;
    color: var(--ink); line-height: 1.45; text-wrap: balance;
  }
  .vas-wrap { width: 100%; max-width: 560px; }
  .vas {
    position: relative;
    height: 56px;
    cursor: crosshair;
    touch-action: none;
    user-select: none;
  }
  .vas .line {
    position: absolute; left: 0; right: 0; top: 50%;
    height: 2px; background: var(--line); transform: translateY(-50%);
  }
  .vas .end {
    position: absolute; top: 50%; width: 2px; height: 22px;
    background: var(--line); transform: translate(0, -50%);
  }
  .vas .end.l { left: 0; } .vas .end.r { right: 0; }
  .vas .marker {
    position: absolute; top: 50%; width: 3px; height: 34px;
    background: var(--line); transform: translate(-50%, -50%);
    display: none;
  }
  .vas.answered .marker { display: block; }
  /* Optional landmark ticks. Deliberately short, thin and low-contrast: they are
     memory pegs, not response categories. Response stays continuous (0.1). */
  .vas .tick {
    position: absolute; top: 50%; width: 1px; height: 11px;
    background: var(--line); opacity: 0.38;
    transform: translate(-50%, -50%);
  }
  .field .hint { font-size: 12px; color: var(--ink-soft); font-weight: 400; margin-top: 4px; display: block; }
  .anchors {
    display: flex; justify-content: space-between; gap: 20px;
    font-size: 13px; font-weight: 600; color: #1b1b1b;
    line-height: 1.35;
    margin-top: 8px;
  }
  .anchors span { flex: 1 1 0; max-width: 46%; }
  .anchors.short { font-size: 15px; }
  .anchors.short span { flex: 0 0 auto; max-width: none; }
  .anchors span:last-child { text-align: right; }
  @media (max-width: 520px) { .anchors { font-size: 12px; gap: 12px; } }
  .trial .actions { justify-content: center; margin-top: 0; }

  /* Demo VAS in instructions is not interactive */
  .demo .vas { cursor: default; height: 44px; }
  .demo .vas .marker { display: block; left: 50%; opacity: 0.35; }

  .status { font-size: 19px; font-weight: 600; line-height: 1.45; color: var(--ink); }
  @media (max-width: 520px) { .status { font-size: 17px; } }
  .code {
    font: 500 22px var(--mono); letter-spacing: 0.12em;
    background: #fff; border: 1px solid var(--panel-edge);
    padding: 12px 16px; display: inline-block; margin: 6px 0 14px;
  }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .patch { transition: background-color 0s; }
  }
</style>

</head>
<body>
<div class="lang-switcher" id="lang-switcher" style="display:none">
  <button type="button" class="toggle" id="lang-switch-btn" aria-haspopup="true" aria-expanded="false">
    <span id="lang-switch-label">EN</span><span class="caret">▾</span>
  </button>
  <div class="lang-menu" id="lang-menu" hidden>
    <button type="button" data-lang="ja">日本語</button>
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="zh-Hant">繁體中文</button>
  </div>
</div>
<main>
  <!-- 0. Language -->
  <section class="screen active" id="s-lang">
    <div class="panel">
      <p class="eyebrow">臺灣中興大學 ・ 日本九州大學</p>
      <h1>言語を選んでください / Choose a language / 請選擇語言</h1>
      <div class="lang">
        <button type="button" data-lang="ja">日本語 <small>JA</small></button>
        <button type="button" data-lang="en">English <small>EN</small></button>
        <button type="button" data-lang="zh-Hant">繁體中文 <small>ZH-TW</small></button>
      </div>
    </div>
  </section>

  <!-- 1. Consent + ID -->
  <section class="screen" id="s-consent">
    <div class="panel">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="title"></h1>
      <p data-i18n="consent1"></p>
      <p data-i18n="consent2"></p>
      <div class="stack" style="margin-top:22px">
        <label class="field">
          <span data-i18n="ageLabel"></span>
          <input type="number" id="age" inputmode="numeric" min="0" max="120" step="1" autocomplete="off">
        </label>
        <div class="field">
          <span data-i18n="genderLabel"></span>
          <div class="radio-group" id="gender-group">
            <label><input type="radio" name="gender" value="male"><span data-i18n="genderMale"></span></label>
            <label><input type="radio" name="gender" value="female"><span data-i18n="genderFemale"></span></label>
            <label><input type="radio" name="gender" value="other"><span data-i18n="genderOther"></span></label>
            <label><input type="radio" name="gender" value="no_answer"><span data-i18n="genderNoAnswer"></span></label>
          </div>
        </div>
        <div class="field">
          <span data-i18n="cvLabel"></span>
          <div class="radio-group" id="cv-group">
            <label><input type="radio" name="colorvision" value="yes"><span data-i18n="cvYes"></span></label>
            <label><input type="radio" name="colorvision" value="no" checked><span data-i18n="cvNo"></span></label>
            <label><input type="radio" name="colorvision" value="unsure"><span data-i18n="cvUnsure"></span></label>
          </div>
        </div>
        <label class="field">
          <span data-i18n="skinTempLabel"></span>
          <input type="number" id="skin-temp" inputmode="decimal" min="10" max="45" step="0.1" autocomplete="off" placeholder="—">
          <small class="hint" data-i18n="skinTempHint"></small>
        </label>
        <label class="check">
          <input type="checkbox" id="consent">
          <span data-i18n="consentCheck"></span>
        </label>
      </div>
      <div class="actions">
        <button type="button" id="btn-consent" disabled data-i18n="next"></button>
      </div>
    </div>
  </section>

  <!-- 3. Instructions -->
  <section class="screen" id="s-instr">
    <div class="panel">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="instrTitle"></h1>
      <p data-i18n="instr1"></p>
      <p data-i18n="instr2"></p>
      <div class="demo vas-wrap" style="margin:18px 0 22px">
        <div class="vas"><div class="line"></div><div class="end l"></div><div class="end r"></div><div class="marker"></div></div>
        <div class="anchors"><span data-i18n="coldLong"></span><span data-i18n="hotLong"></span></div>
      </div>
      <p data-i18n="instr3"></p>
      <div class="actions">
        <button type="button" id="btn-start" data-i18n="startPractice"></button>
      </div>
    </div>
  </section>

  <!-- 4. Trial -->
  <section class="screen" id="s-trial">
    <div class="trial">
      <div class="counter" id="counter"></div>
      <div class="stimulus">
        <div class="patch" id="patch"></div>
        <div class="probe" id="probe" hidden>
          <span class="probe-prompt" id="probe-prompt"></span>
          <span class="probe-text" id="probe-text"></span>
        </div>
      </div>
      <div class="vas-wrap">
        <div class="vas" id="vas" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100">
          <div class="line"></div><div class="end l"></div><div class="end r"></div><div class="marker" id="marker"></div>
        </div>
        <div class="anchors short"><span data-i18n="cold"></span><span data-i18n="hot"></span></div>
      </div>
      <div class="actions">
        <button type="button" id="btn-next" disabled data-i18n="next"></button>
      </div>
    </div>
  </section>

  <!-- 4b. Between practice and main -->
  <section class="screen" id="s-main-intro">
    <div class="panel">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="mainTitle"></h1>
      <p data-i18n="main1"></p>
      <p data-i18n="main2"></p>
      <div class="demo vas-wrap" style="margin:18px 0 6px">
        <div class="vas"><div class="line"></div><div class="end l"></div><div class="end r"></div></div>
        <div class="anchors"><span data-i18n="coldLong"></span><span data-i18n="hotLong"></span></div>
      </div>
      <div class="actions">
        <button type="button" id="btn-main" data-i18n="startMain"></button>
      </div>
    </div>
  </section>

  <!-- 4c. Intermission between the two blocks -->
  <section class="screen" id="s-break">
    <div class="panel">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="breakTitle"></h1>
      <p data-i18n="break1"></p>
      <p data-i18n="break2"></p>
      <div class="actions">
        <button type="button" id="btn-break" data-i18n="breakContinue"></button>
      </div>
    </div>
  </section>

  <!-- 5. Done -->
  <section class="screen" id="s-done">
    <div class="panel">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="doneTitle"></h1>
      <p class="status" id="send-status"></p>
      <div class="row" style="gap:28px;align-items:flex-start">
        <div>
          <p data-i18n="subjectLabel" style="margin-bottom:2px"></p>
          <div class="code" id="subject"></div>
        </div>
        <div>
          <p data-i18n="codeLabel" style="margin-bottom:2px"></p>
          <div class="code" id="code"></div>
        </div>
      </div>
      <p data-i18n="done1"></p>
      <div class="actions" style="justify-content:flex-start">
        <button type="button" class="secondary" id="btn-csv" data-i18n="download"></button>
        <button type="button" class="secondary" id="btn-restart" data-i18n="restart"></button>
      </div>
    </div>
  </section>
</main>

<script>
/* ============================================================
   CONFIG — edit this block only
   ============================================================ */
const CONFIG = {
  STUDY_ID: "color-temp-vas-v1",
  // Google Apps Script web-app URL (see README). Leave "" to disable
  // online submission; participants then download a CSV at the end.
  ENDPOINT_URL: "https://script.google.com/macros/s/AKfycbxLdmTyOn5jF70sgHw4hiFL2F9Tnx5V8OXkSbkH04JnSCA9nLdAEiU-Y8WiX4B7vmzQEA/exec",
  REPS: 1,                 // repetitions of each color (1 = each color shown once)
  ISI_MS: 500,             // blank grey between trials
  // Faint unlabelled landmarks on the line, as percentages. [] = none.
  // They help participants keep their own use of the scale stable across trials;
  // the response itself stays continuous. Logged in the vas_ticks column.
  VAS_TICKS: [25, 50, 75],
  TRIAL_TIMEOUT_MS: 0,     // 0 = no time limit; set e.g. 60000 for a 60 s limit
  // Practice = rating PHYSICAL thermal stimuli on the plates at the booth, not
  // colors. These set the participant's use of the scale and give per-person
  // landmarks measured in real degrees. Recorded with practice=1 and
  // trial_type="referent"; temp_c holds the plate's set temperature.
  // The screen never shows the temperature — only the plate label — so that
  // participants judge the sensation rather than doing arithmetic on the scale.
  // Keep `label` identical to the physical marking on each plate.
  // One Peltier hot/cold plate, re-set by staff between touches. FIXED order
  // 30 -> 15 -> 45: the 30 degC reading is taken with the hand at rest (it is the
  // point closest to skin temperature and so the most vulnerable to adaptation),
  // and the sequence ends warm, because cold after-effects outlast warm ones.
  // 30 is also the exact midpoint of 15 and 45, which makes its rating a free
  // test of whether the VAS is linear in degrees.
  REFERENTS: [
    { key: "ref_mid",  step: 1, temp_c: 30 },
    { key: "ref_cold", step: 2, temp_c: 15 },
    { key: "ref_hot",  step: 3, temp_c: 45 }
  ],
  // Touches are brief, so no enforced recovery interval. Set >0 to reinstate it.
  REFERENT_REST_S: 0,
  // --- network ---
  // Several tablets share ONE Apps Script lock, so what matters is the number of
  // requests, not their size. Trials are therefore buffered and uploaded in
  // batches: ~8 requests per participant instead of 30. Failed flushes are never
  // retried in-session - the rows simply stay in the buffer and go out with the
  // next flush, which is self-healing and cannot pile up.
  NET: {
    FLUSH_EVERY: 6,        // upload once this many rows are waiting (1 = per trial)
    REGISTER_MS: 30000,    // background; the participant is reading meanwhile
    BATCH_MS: 30000,       // background; nobody waits on these
    FINISH_MS: 20000,
    ATTEMPTS: 3,           // registration only
    START_WAIT_MS: 6000,   // extra wait at "start practice" if registration is slow
    DRAIN_MS: 15000,       // cap on waiting for an in-flight flush at the end
    TAIL_MS: 30000         // hard cap on the whole end-of-session send
  },
  // No practice colour: the three plate ratings already teach the scale.
  // Both sets run in one session as two blocks. The order is randomised per
  // participant unless RANDOMIZE_BLOCK_ORDER is false.
  BLOCK_ORDER: ["chao", "cielch"],
  RANDOMIZE_BLOCK_ORDER: true,
  SETS: {
    // Run 1 — Dr. Chao's educational hue circle. RGB taken from the colour-wheel
    // figure she uses (warm swatches are R255; the figure's "R225" labels are a typo,
    // confirmed by sampling the image). The CMY string is her nominal ink recipe —
    // note the cool half does NOT equal a naive CMY->RGB conversion of it.
    // L*, C*, h are measured from the RGB below.
    chao: [
      { name: "chao_yellow", zh: "黃", cmy: "C0M0Y100", hue: 102.9, L: 97.1, C: 96.9, rgb: [255, 255, 0] },
      { name: "chao_yellow_orange", zh: "黃橙", cmy: "C0M25Y100", hue: 82.5, L: 80.8, C: 83.6, rgb: [255, 190, 0] },
      { name: "chao_orange", zh: "橙", cmy: "C0M50Y100", hue: 59.9, L: 67.1, C: 85.5, rgb: [255, 128, 0] },
      { name: "chao_red_orange", zh: "紅橙", cmy: "C0M75Y100", hue: 44.7, L: 57.0, C: 97.6, rgb: [255, 64, 0] },
      { name: "chao_red", zh: "紅", cmy: "C0M100Y100", hue: 40.0, L: 53.2, C: 104.6, rgb: [255, 0, 0] },
      { name: "chao_red_purple", zh: "紅紫", cmy: "C25M100Y0", hue: 346.4, L: 41.0, C: 71.3, rgb: [185, 3, 126] },
      { name: "chao_purple", zh: "紫", cmy: "C50M100Y0", hue: 329.4, L: 30.1, C: 68.1, rgb: [130, 2, 126] },
      { name: "chao_blue_purple", zh: "藍紫", cmy: "C75M100Y0", hue: 314.5, L: 19.9, C: 71.7, rgb: [74, 1, 125] },
      { name: "chao_blue", zh: "藍", cmy: "C100M100Y0", hue: 307.0, L: 13.3, C: 77.0, rgb: [19, 1, 124] },
      { name: "chao_blue_green", zh: "藍綠", cmy: "C100M50Y50", hue: 236.2, L: 28.7, C: 20.8, rgb: [5, 74, 94] },
      { name: "chao_green", zh: "綠", cmy: "C100M0Y100", hue: 145.4, L: 49.4, C: 60.3, rgb: [1, 136, 55] },
      { name: "chao_yellow_green", zh: "黃綠", cmy: "C50M0Y100", hue: 123.3, L: 72.3, C: 81.5, rgb: [128, 196, 28] }
    ],
    // Run 2 — even 30 deg CIELCh steps anchored so that red falls at h=40
    // (h=40 at maximum sRGB chroma is exactly pure red). Max chroma at each hue,

function makeId() {
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  const buf = new Uint8Array(8);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(buf) : buf.forEach((_, i) => buf[i] = Math.random() * 256);
  for (const b of buf) s += a[b % a.length];
  return s;
}
function hex([r, g, b]) { return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join(""); }
function fmt(s, vars) { return s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? ""); }

/* ---------- navigation ---------- */
function show(id) {

/* ---------- sequence ---------- */
function buildSequence() {
  const seq = [];
  const refs = CONFIG.REFERENTS.slice();   // fixed order, set by the plate protocol
  referentOrder = refs.map(r => r.key);
  refs.forEach(r => seq.push({ kind: "referent", ref: r, key: r.key,
                               practice: 1, rep: 0, block: 0, set: "" }));
  blockOrder = CONFIG.BLOCK_ORDER.slice();
  if (CONFIG.RANDOMIZE_BLOCK_ORDER) shuffle(blockOrder);
  blockOrder.forEach((setName, bi) => {
    const colors = CONFIG.SETS[setName];
    let prev = null;
    for (let r = 1; r <= CONFIG.REPS; r++) {
      let blk;
      do {
        blk = shuffle(colors.slice());
      } while (prev && blk[0].name === prev.name && colors.length > 1);
      blk.forEach(c => seq.push({ kind: "color", color: c, practice: 0, rep: r,
                                 block: bi + 1, set: setName }));
      prev = blk[blk.length - 1];
    }
  });
  return seq;
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- device info ---------- */
function deviceInfo() {
  const mm = (q) => (window.matchMedia && window.matchMedia(q).matches) ? 1 : 0;
  return {
    screen_w: screen.width, screen_h: screen.height,
    viewport_w: window.innerWidth, viewport_h: window.innerHeight,
    dpr: window.devicePixelRatio || 1,
    color_depth: screen.colorDepth,
    gamut_p3: mm("(color-gamut: p3)"),
    prefers_dark: mm("(prefers-color-scheme: dark)"),
    touch: ("ontouchstart" in window) ? 1 : 0,
    user_agent: navigator.userAgent,
    tz: (Intl.DateTimeFormat().resolvedOptions().timeZone) || ""
  };
}

/* ---------- VAS ---------- */
const vas = $("vas"), marker = $("marker"), patch = $("patch");
(function addTicks() {
  const ticks = CONFIG.VAS_TICKS || [];
  if (!ticks.length) return;
  document.querySelectorAll(".vas").forEach(el => {
    ticks.forEach(pct => {
      const d = document.createElement("div");
      d.className = "tick";
      d.style.left = pct + "%";
      el.insertBefore(d, el.querySelector(".marker") || null);
    });
  });
})();
let dragging = false;
function setVas(clientX) {
  const rect = vas.getBoundingClientRect();
  let v = (clientX - rect.left) / rect.width * 100;
  v = Math.max(0, Math.min(100, v));
  cur.vas = Math.round(v * 10) / 10;
  if (cur.rtFirst == null) cur.rtFirst = Math.round(performance.now() - cur.onset);
  cur.nClicks++;
  marker.style.left = v + "%";
  vas.classList.add("answered");
  vas.setAttribute("aria-valuenow", cur.vas);
  $("btn-next").disabled = false;
}
vas.addEventListener("pointerdown", (e) => {
  if (!cur) return;
  dragging = true;
  vas.setPointerCapture(e.pointerId);
  setVas(e.clientX);
});
vas.addEventListener("pointermove", (e) => { if (dragging) setVas(e.clientX); });
vas.addEventListener("pointerup", () => { dragging = false; });
vas.addEventListener("pointercancel", () => { dragging = false; });
vas.addEventListener("keydown", (e) => {
  if (!cur || cur.vas == null) return;
  const step = e.shiftKey ? 5 : 1;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    const rect = vas.getBoundingClientRect();
    const v = cur.vas + (e.key === "ArrowLeft" ? -step : step);
    setVas(rect.left + Math.max(0, Math.min(100, v)) / 100 * rect.width);
  }
});

/* ---------- trials ---------- */
function updateCounterText() {
  if (!trials.length || idx >= trials.length) return;
  const t = trials[idx];
  const mainTotal = trials.filter(x => !x.practice).length;
  const mainIndex = trials.slice(0, idx + 1).filter(x => !x.practice).length;
  $("counter").textContent = t.practice ? T.practice : fmt(T.counter, { i: mainIndex, n: mainTotal });
}
function renderProbeText() {
  const t = trials[idx];
  if (!t || t.kind !== "referent") return;
  $("probe-prompt").textContent = T.probePrompt;
  $("probe-text").textContent = fmt(T.refTouch, { i: t.ref.step, n: CONFIG.REFERENTS.length });
}
function startTrial() {
  const t = trials[idx];
  const isColor = t.kind === "color";
  const prev = idx > 0 ? trials[idx - 1] : null;
  // Longer gap before a referent that follows another referent, so the skin can
  // re-equilibrate before the next plate is touched.
  const restMs = (t.kind === "referent" && prev && prev.kind === "referent")
    ? (CONFIG.REFERENT_REST_S || 0) * 1000 : 0;
  const waitMs = restMs || CONFIG.ISI_MS;
  updateCounterText();
  vas.classList.remove("answered");
  vas.removeAttribute("aria-valuenow");
  $("btn-next").disabled = true;
  patch.style.background = "var(--ground)";
  patch.hidden = !isColor;
  $("probe").hidden = isColor;
  $("probe-prompt").textContent = "";
  $("probe-text").textContent = "";
  cur = null;
  show("s-trial");
  clearInterval(restTimer); restTimer = null;
  if (restMs) {
    $("probe").hidden = false;
    let left = Math.round(restMs / 1000);
    const tick = () => {
      $("probe-prompt").textContent = "";
      $("probe-text").textContent = fmt(T.restPrompt, { s: left });
    };
    tick();
    restTimer = setInterval(() => { left--; if (left > 0) tick(); else clearInterval(restTimer); }, 1000);
  }
  setTimeout(() => {
    clearInterval(restTimer); restTimer = null;
    if (isColor) patch.style.background = hex(t.color.rgb);
    else renderProbeText();
    cur = { onset: performance.now(), vas: null, rtFirst: null, nClicks: 0, timedOut: 0 };
    vas.focus({ preventScroll: true });
    if (CONFIG.TRIAL_TIMEOUT_MS > 0) {
      trialTimer = setTimeout(() => { if (cur) { cur.timedOut = 1; endTrial(); } }, CONFIG.TRIAL_TIMEOUT_MS);
    }
  }, waitMs);
}
function renderMainIntroText() {
  const total = trials.filter(x => !x.practice).length;
  const sets = blockOrder.length || 1;
  $("s-main-intro").querySelector("[data-i18n='main1']").textContent =
    fmt(T.main1, { sets: sets, total: total });
}
function endTrial() {
  clearTimeout(trialTimer); trialTimer = null;
  const t = trials[idx];
  const isColor = t.kind === "color";
  const c = isColor ? t.color : null;
  session.rows.push({
    study_id: CONFIG.STUDY_ID,
    session_id: session.id,
    subject_code: session.subject,
    participant_id: session.pid,
    age: session.age,
    gender: session.gender,
    color_vision_difficulty: session.colorVision,
    skin_temp_c: session.skinTemp,
    lang,
    color_set: isColor ? t.set : "",
    block: isColor ? t.block : "",
    block_order: blockOrder.join("|"),
    practice: t.practice,
    trial_type: isColor ? "color" : "referent",
    trial: idx + 1,
    rep: t.rep,
    color_name: isColor ? c.name : t.key,
    ref_step: isColor ? "" : t.ref.step,
    ref_temp_c: isColor ? "" : t.ref.temp_c,
    referent_order: referentOrder.join("|"),
    cmy: isColor ? c.cmy : "",
    hue_deg: isColor && c.hue != null ? c.hue : "",
    L_star: isColor ? c.L : "", C_star: isColor ? c.C : "",
    r: isColor ? c.rgb[0] : "", g: isColor ? c.rgb[1] : "", b: isColor ? c.rgb[2] : "",
    hex: isColor ? hex(c.rgb) : "",
    vas: cur.vas == null ? "" : cur.vas,
    vas_ticks: (CONFIG.VAS_TICKS || []).join("|"),
    timed_out: cur.timedOut,
    rt_first_ms: cur.rtFirst == null ? "" : cur.rtFirst,
    rt_submit_ms: Math.round(performance.now() - cur.onset),
    n_adjust: cur.nClicks,
    timestamp: new Date().toISOString(),
    ...session.device
  });
  sendTrial(session.rows[session.rows.length - 1]);
  idx++;
  if (idx >= trials.length) { finish(); return; }
  const next = trials[idx], done = trials[idx - 1];
  if (!next.practice && !mainStarted) {
    mainStarted = true;
    flush();                 // participant is reading; a slow request is invisible
    renderMainIntroText();
    show("s-main-intro");
  } else if (!next.practice && !done.practice && next.kind === "color" &&
             done.kind === "color" && next.block !== done.block) {
    flush();
    show("s-break");
  } else {
    startTrial();
  }
}

/* ---------- network ----------
   Timeouts are generous because only registration is ever waited on, and that
   runs in the background while the participant reads. When a reply is slow the
   page gives up and re-sends even though the write may have succeeded; the
   Apps Script skips any row whose session_id + trial it already holds, and
   returns the existing subject code for a repeated registration, so re-sending
   is always safe. NEEDS the 2026-09 Code.gs - redeploy after updating it. */
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
async function post(payload, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || CONFIG.NET.TRIAL_MS);
  try {
    const res = await fetch(CONFIG.ENDPOINT_URL, {
      method: "POST", body: JSON.stringify(payload),
      headers: { "Content-Type": "text/plain;charset=utf-8" }, signal: ctrl.signal
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}
async function postRetry(payload, timeoutMs, attempts) {
  const n = attempts || CONFIG.NET.ATTEMPTS;
  let last = "";
  for (let i = 0; i < n; i++) {
    if (i) await sleep(i * 2000);
    try {
      const j = await post(payload, timeoutMs);
      if (j && j.ok) return j;
      last = (j && j.error) ? String(j.error) : "bad reply";
    } catch (e) {
      last = (e && e.name === "AbortError") ? "timeout" : String((e && e.message) || e);
    }
  }
  noteError(payload.action + ":" + last);
  return null;
}
// Repeated identical failures are collapsed to "reason x N" so the note stays short.
function noteError(msg) {
  const hit = session.sendErrors.find(e => e.msg === msg);
  if (hit) hit.n++;
  else if (session.sendErrors.length < 6) session.sendErrors.push({ msg, n: 1 });
}
function errorSummary() {
  return session.sendErrors.map(e => e.n > 1 ? `${e.msg} \u00D7${e.n}` : e.msg).join(" / ");
}
// Wake the Apps Script instance early, so the first real POST is not a cold start.
let warmed = false;
function warmUp() {
  if (warmed || !CONFIG.ENDPOINT_URL) return;
  warmed = true;
  fetch(CONFIG.ENDPOINT_URL, { method: "GET", cache: "no-store" }).catch(() => {});
}
function register() {
  if (!CONFIG.ENDPOINT_URL) return Promise.resolve();
  return postRetry({ action: "register", study_id: CONFIG.STUDY_ID, session_id: session.id,
                     participant_id: session.pid, age: session.age, gender: session.gender,
                     color_vision_difficulty: session.colorVision,
                     skin_temp_c: session.skinTemp,
                     block_order: blockOrder.join("|"),
                     referent_order: referentOrder.join("|"),
                     lang, device: session.device }, CONFIG.NET.REGISTER_MS)
    .then(j => { if (j && j.subject_code) session.subject = j.subject_code; });
}
// Queue a finished trial. Nothing is sent until the buffer is full enough, or a
// pause screen / the end of the session calls flush().
function sendTrial(row) {
  if (!CONFIG.ENDPOINT_URL) return;
  buffer.push(row);
  if (buffer.length >= (CONFIG.NET.FLUSH_EVERY || 6)) flush();
}
// Upload everything currently buffered as ONE request. On failure the rows are
// put back and go out with the next flush, so a bad moment never multiplies into
// extra requests. Only one flush is ever in flight.
function flush(attempts) {
  if (!CONFIG.ENDPOINT_URL || flushing || !buffer.length) return Promise.resolve(true);
  flushing = true;
  const rows = buffer.splice(0, buffer.length);
  const cols = Object.keys(rows[0]);
  const p = postRetry({ action: "batch", columns: cols, rows: rows.map(r => cols.map(k => r[k])) },
                      CONFIG.NET.BATCH_MS, attempts || 1)
    .then(j => {
      if (!j) { buffer.unshift.apply(buffer, rows); return false; }
      return true;
    })
    .catch(() => { buffer.unshift.apply(buffer, rows); return false; })
    .finally(() => { flushing = false; });
  pending.push(p);
  return p;
}
// Keep the screen awake: a sleeping phone suspends in-flight uploads.
let wakeLock = null;
async function keepAwake() {
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); }
  catch (e) { /* not supported, or denied */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && wakeLock === null) keepAwake();
});

/* ---------- finish + submit ---------- */
function columns() { return Object.keys(session.rows[0] || {}); }
function toCsv() {
  const cols = columns();
  const esc = (v) => {
    const s = v == null ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [cols.join(","), ...session.rows.map(r => cols.map(k => esc(r[k])).join(","))].join("\n");
}
let lastStatusKey = null;
function setStatus(key) {
  lastStatusKey = key;
  $("send-status").textContent = T[key];
}
async function finish() {
  show("s-done");
  $("code").textContent = session.subject ? `${session.subject}-${session.id}` : session.id;
  $("subject").textContent = session.subject || "—";
  if (!CONFIG.ENDPOINT_URL) { setStatus("offline"); return; }
  setStatus("sending");
  // Wait for outstanding uploads, but never hang the final screen on one of them.
  await Promise.race([Promise.all(pending), sleep(CONFIG.NET.DRAIN_MS)]);

  const tail = (async () => {
    // Everything still buffered goes up in one batch; this one is worth retrying.
    while (flushing) await sleep(400);               // let any in-flight flush finish
    if (buffer.length) await flush(2);
    sendFailures = buffer.length;
    return !!(await postRetry({ action: "finish", session_id: session.id,
                                n_trials: session.rows.length,
                                send_errors: errorSummary() },
                              CONFIG.NET.FINISH_MS, 2));
  })();

  const applyStatus = (finished) => {
    if (sendFailures > 0) setStatus("partial");
    else if (!session.subject) setStatus("sentNoCode");
    else setStatus(finished ? "sent" : "sentUnconfirmed");
    showSendErrors();
  };
  // On a very bad connection the tail could take minutes; cap it, show the
  // participant a result, and correct the message later if it does get through.
  const r = await Promise.race([tail, sleep(CONFIG.NET.TAIL_MS).then(() => "cap")]);
  if (r === "cap") { setStatus("partial"); showSendErrors(); tail.then(applyStatus); }
  else applyStatus(r);
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}
function showSendErrors() {
  if (!session.sendErrors.length) return;
  let d = $("send-errors");
  if (!d) {
    d = document.createElement("p");
    d.id = "send-errors";
    d.style.cssText = "font-family:var(--mono);font-size:11px;opacity:.55;margin-top:10px";
    $("send-status").parentNode.appendChild(d);
  }
  d.textContent = errorSummary();
}
$("btn-csv").addEventListener("click", () => {
  const blob = new Blob(["\uFEFF" + toCsv()], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${CONFIG.STUDY_ID}_${session.pid || "anon"}_${session.id}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
});

/* ---------- wiring ---------- */
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  applyLang(b.dataset.lang);
  warmUp();          // wake the Apps Script while the consent form is being read
  show("s-consent");
}));

/* Persistent language switcher: lets the participant change language mid-experiment */
$("lang-switch-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  const open = $("lang-menu").hidden;
  $("lang-menu").hidden = !open;
  $("lang-switch-btn").setAttribute("aria-expanded", String(open));
});
document.querySelectorAll("#lang-menu button").forEach(b => b.addEventListener("click", () => {
  applyLang(b.dataset.lang);
  $("lang-menu").hidden = true;
  $("lang-switch-btn").setAttribute("aria-expanded", "false");
}));
document.addEventListener("click", (e) => {
  if (!$("lang-switcher").contains(e.target)) {
    $("lang-menu").hidden = true;
    $("lang-switch-btn").setAttribute("aria-expanded", "false");
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    $("lang-menu").hidden = true;
    $("lang-switch-btn").setAttribute("aria-expanded", "false");
  }
});

function updateConsentGate() {
  const ageOk = $("age").value.trim() !== "";
  const genderOk = !!document.querySelector('input[name="gender"]:checked');
  $("btn-consent").disabled = !($("consent").checked && ageOk && genderOk);
}
$("consent").addEventListener("change", updateConsentGate);
$("age").addEventListener("input", updateConsentGate);
document.querySelectorAll('input[name="gender"]').forEach(r => r.addEventListener("change", updateConsentGate));
$("btn-consent").addEventListener("click", () => {
  session.age = $("age").value.trim();
  session.gender = (document.querySelector('input[name="gender"]:checked') || {}).value || "";
  session.colorVision = (document.querySelector('input[name="colorvision"]:checked') || {}).value || "";
  session.skinTemp = $("skin-temp").value.trim();
  // Register now, in the background, while the participant reads the
  // instructions. By the time they press "start practice" the code is normally
  // already in hand, so nobody waits on a cold start.
  session.device = deviceInfo();
  trials = buildSequence();
  idx = 0;
  registerPromise = register();
  keepAwake();
  show("s-instr");
});
$("btn-start").addEventListener("click", async () => {
  const btn = $("btn-start");
  if (registerPromise && !session.subject) {
    btn.disabled = true;
    btn.textContent = T.preparing;
    // Registration is usually finished already; if not, give it a little longer
    // and then start anyway. session_id still links every row.
    await Promise.race([registerPromise, sleep(CONFIG.NET.START_WAIT_MS)]);
    btn.disabled = false;
    btn.textContent = T.startPractice;
  }
  startTrial();
});
$("btn-main").addEventListener("click", startTrial);
$("btn-break").addEventListener("click", startTrial);
$("btn-restart").addEventListener("click", () => location.reload());
$("btn-next").addEventListener("click", () => { if (cur && cur.vas != null) endTrial(); });
</script>
