<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Temperature VAS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Noto+Sans+TC:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Single fixed theme on purpose: the stimulus must render on the same
     neutral ground for every participant, regardless of OS dark mode. */
  :root {
    --ground: #8f8f8f;      /* neutral grey, L* ≈ 60 */
    --panel: #ececec;
    --panel-edge: #d6d6d6;
    --ink: #1b1b1b;
    --ink-soft: #4a4a4a;
    --ink-faint: #7a7a7a;
    --line: #1b1b1b;
    --focus: #1b1b1b;
    --sans: "Noto Sans", "Noto Sans JP", "Noto Sans TC", "Hiragino Sans", "Microsoft JhengHei", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  html[lang="ja"] { --sans: "Noto Sans JP", "Noto Sans", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; }
  html[lang="zh-Hant"] { --sans: "Noto Sans TC", "Noto Sans", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 32px 20px;
  }
  .screen { display: none; width: 100%; }
  .screen.active { display: block; }

  /* Panels for text screens */
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    max-width: 600px;
    margin: 0 auto;
    padding: 36px 40px 32px;
  }
  @media (max-width: 520px) { .panel { padding: 28px 22px 24px; } }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 8px;
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0 0 20px;
    text-wrap: balance;
  }
  p { margin: 0 0 14px; max-width: 62ch; color: var(--ink-soft); }
  p.strong { color: var(--ink); }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }

  label.field { display: block; font-size: 14px; color: var(--ink-soft); }
  label.field span { display: block; margin-bottom: 6px; }
  input[type="text"] {
    width: 100%;
    font: 500 16px var(--mono);
    padding: 10px 12px;
    border: 1px solid var(--ink-faint);
    background: #fff;
    color: var(--ink);
    border-radius: 0;
  }
  input[type="text"]:focus-visible, button:focus-visible, .vas:focus-visible, .lang button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; color: var(--ink); cursor: pointer; }
  .check input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--ink); flex: none; }

  button {
    font: 600 15px var(--sans);
    padding: 11px 22px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    cursor: pointer;
    border-radius: 0;
  }
  button.secondary { background: transparent; color: var(--ink); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Language chooser */
  .lang { display: grid; gap: 10px; margin-top: 8px; }
  .lang button {
    display: flex; justify-content: space-between; align-items: baseline;
    width: 100%; text-align: left;
    background: #fff; color: var(--ink); border: 1px solid var(--panel-edge);
    padding: 14px 18px; font-weight: 600; font-size: 17px;
  }
  .lang button small { font: 400 12px var(--mono); color: var(--ink-faint); letter-spacing: 0.06em; }
  .lang button:hover { border-color: var(--ink); }

  /* Trial screen */
  .trial {
    display: flex; flex-direction: column; align-items: center; gap: 40px;
    width: 100%; max-width: 640px; margin: 0 auto;
  }
  .counter {
    font: 500 13px var(--mono);
    letter-spacing: 0.06em;
    color: #2b2b2b;
    font-variant-numeric: tabular-nums;
    align-self: flex-start;
    min-height: 20px;
  }
  .patch {
    width: min(58vmin, 380px);
    height: min(58vmin, 380px);
    background: var(--ground);
  }
  .vas-wrap { width: 100%; max-width: 560px; }
  .vas {
    position: relative;
    height: 56px;
    cursor: crosshair;
    touch-action: none;
    user-select: none;
  }
  .vas .line {
    position: absolute; left: 0; right: 0; top: 50%;
    height: 2px; background: var(--line); transform: translateY(-50%);
  }
  .vas .end {
    position: absolute; top: 50%; width: 2px; height: 22px;
    background: var(--line); transform: translate(0, -50%);
  }
  .vas .end.l { left: 0; } .vas .end.r { right: 0; }
  .vas .marker {
    position: absolute; top: 50%; width: 3px; height: 34px;
    background: var(--line); transform: translate(-50%, -50%);
    display: none;
  }
  .vas.answered .marker { display: block; }
  .anchors {
    display: flex; justify-content: space-between;
    font-size: 15px; font-weight: 600; color: #1b1b1b;
    margin-top: 4px;
  }
  .trial .actions { justify-content: center; margin-top: 0; }

  /* Demo VAS in instructions is not interactive */
  .demo .vas { cursor: default; height: 44px; }
  .demo .vas .marker { display: block; left: 50%; opacity: 0.35; }

  .status { font-family: var(--mono); font-size: 14px; color: var(--ink-soft); }
  .code {
    font: 500 22px var(--mono); letter-spacing: 0.12em;
    background: #fff; border: 1px solid var(--panel-edge);
    padding: 12px 16px; display: inline-block; margin: 6px 0 14px;
  }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .patch { transition: background-color 0s; }
  }
</style>

</head>
<body>
<main>
  <!-- 0. Language -->
  <section class="screen active" id="s-lang">
    <div class="panel">
      <p class="eyebrow">Kyushu University · Haptics Lab</p>
      <h1>言語を選んでください / Choose a language / 請選擇語言</h1>
      <div class="lang">
        <button type="button" data-lang="ja">日本語 <small>JA</small></button>
        <button type="button" data-lang="en">English <small>EN</small></button>
        <button type="button" data-lang="zh-Hant">繁體中文 <small>ZH-TW</small></button>
      </div>
    </div>
  </section>

  <!-- 1. Consent + ID -->
  <section class="screen" id="s-consent">
    <div class="panel">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="title"></h1>
      <p data-i18n="consent1"></p>
      <p data-i18n="consent2"></p>
      <div class="stack" style="margin-top:22px">
        <label class="field">
          <span data-i18n="pidLabel"></span>
          <input type="text" id="pid" autocomplete="off" spellcheck="false" maxlength="40">
        </label>
        <label class="check">
          <input type="checkbox" id="consent">
          <span data-i18n="consentCheck"></span>
        </label>
      </div>
      <div class="actions">
        <button type="button" id="btn-consent" disabled data-i18n="next"></button>
      </div>
    </div>
  </section>

  <!-- 2. Screen setup -->
  <section class="screen" id="s-screen">
    <div class="panel">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="screenTitle"></h1>
      <p data-i18n="screen1"></p>
      <p data-i18n="screen2"></p>
      <p data-i18n="screen3"></p>
      <div class="actions">
        <button type="button" class="secondary" id="btn-fs" data-i18n="fullscreen"></button>
        <button type="button" id="btn-screen" data-i18n="next"></button>
      </div>
    </div>
  </section>

  <!-- 3. Instructions -->
  <section class="screen" id="s-instr">
    <div class="panel">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="instrTitle"></h1>
      <p data-i18n="instr1"></p>
      <p data-i18n="instr2"></p>
      <div class="demo vas-wrap" style="margin:18px 0 6px">
        <div class="vas"><div class="line"></div><div class="end l"></div><div class="end r"></div><div class="marker"></div></div>
        <div class="anchors"><span data-i18n="cold"></span><span data-i18n="hot"></span></div>
      </div>
      <p data-i18n="instr3"></p>
      <div class="actions">
        <button type="button" id="btn-start" data-i18n="startPractice"></button>
      </div>
    </div>
  </section>

  <!-- 4. Trial -->
  <section class="screen" id="s-trial">
    <div class="trial">
      <div class="counter" id="counter"></div>
      <div class="patch" id="patch"></div>
      <div class="vas-wrap">
        <div class="vas" id="vas" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100">
          <div class="line"></div><div class="end l"></div><div class="end r"></div><div class="marker" id="marker"></div>
        </div>
        <div class="anchors"><span data-i18n="cold"></span><span data-i18n="hot"></span></div>
      </div>
      <div class="actions">
        <button type="button" id="btn-next" disabled data-i18n="next"></button>
      </div>
    </div>
  </section>

  <!-- 4b. Between practice and main -->
  <section class="screen" id="s-main-intro">
    <div class="panel">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="mainTitle"></h1>
      <p data-i18n="main1"></p>
      <div class="actions">
        <button type="button" id="btn-main" data-i18n="startMain"></button>
      </div>
    </div>
  </section>

  <!-- 5. Done -->
  <section class="screen" id="s-done">
    <div class="panel">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="doneTitle"></h1>
      <p class="status" id="send-status"></p>
      <div class="row" style="gap:28px;align-items:flex-start">
        <div>
          <p data-i18n="subjectLabel" style="margin-bottom:2px"></p>
          <div class="code" id="subject"></div>
        </div>
        <div>
          <p data-i18n="codeLabel" style="margin-bottom:2px"></p>
          <div class="code" id="code"></div>
        </div>
      </div>
      <p data-i18n="done1"></p>
      <div class="actions" style="justify-content:flex-start">
        <button type="button" class="secondary" id="btn-csv" data-i18n="download"></button>
        <button type="button" class="secondary" id="btn-restart" data-i18n="restart"></button>
      </div>
    </div>
  </section>
</main>

<script>
/* ============================================================
   CONFIG — edit this block only

const CONFIG = {

   State
   ============================================================ */

let lang = "en";
let T = I18N.en;

  id: makeId(),
  subject: "",       // assigned by the sheet at registration (S001, S002, …)

let trials = [];       // sequence of {color, practice, rep}
let idx = 0;
let cur = null;        // current trial timing/response
let mainStarted = false;
const pending = [];    // in-flight trial uploads
let sendFailures = 0;
let trialTimer = null;

function makeId() {
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  const buf = new Uint8Array(8);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(buf) : buf.forEach((_, i) => buf[i] = Math.random() * 256);
  for (const b of buf) s += a[b % a.length];
  return s;
}
function hex([r, g, b]) { return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join(""); }
function fmt(s, vars) { return s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? ""); }

/* ---------- i18n ---------- */
function applyLang(code) {
  lang = code;
  T = I18N[code];
  document.documentElement.lang = code === "zh-Hant" ? "zh-Hant" : code;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (key in T) el.textContent = T[key];
  });
  $("btn-fs").classList.toggle("hidden", !document.documentElement.requestFullscreen);
}

/* ---------- navigation ---------- */
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  window.scrollTo(0, 0);
}

/* ---------- sequence ---------- */
function buildSequence() {
  const seq = [];
  CONFIG.PRACTICE_COLORS.forEach(c => seq.push({ color: c, practice: 1, rep: 0 }));
  let prev = null;
  for (let r = 1; r <= CONFIG.REPS; r++) {
    let block;
    do {
      block = shuffle(CONFIG.COLORS.slice());
    } while (prev && block[0].name === prev.name && CONFIG.COLORS.length > 1);
    block.forEach(c => seq.push({ color: c, practice: 0, rep: r }));
    prev = block[block.length - 1];
  }
  return seq;
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- device info ---------- */
function deviceInfo() {
  const mm = (q) => (window.matchMedia && window.matchMedia(q).matches) ? 1 : 0;
  return {
    screen_w: screen.width, screen_h: screen.height,
    viewport_w: window.innerWidth, viewport_h: window.innerHeight,
    dpr: window.devicePixelRatio || 1,
    color_depth: screen.colorDepth,
    gamut_p3: mm("(color-gamut: p3)"),
    prefers_dark: mm("(prefers-color-scheme: dark)"),
    touch: ("ontouchstart" in window) ? 1 : 0,
    user_agent: navigator.userAgent,
    tz: (Intl.DateTimeFormat().resolvedOptions().timeZone) || ""
  };
}

/* ---------- VAS ---------- */
const vas = $("vas"), marker = $("marker"), patch = $("patch");
let dragging = false;
function setVas(clientX) {
  const rect = vas.getBoundingClientRect();
  let v = (clientX - rect.left) / rect.width * 100;
  v = Math.max(0, Math.min(100, v));
  cur.vas = Math.round(v * 10) / 10;
  if (cur.rtFirst == null) cur.rtFirst = Math.round(performance.now() - cur.onset);
  cur.nClicks++;
  marker.style.left = v + "%";
  vas.classList.add("answered");
  vas.setAttribute("aria-valuenow", cur.vas);
  $("btn-next").disabled = false;
}
vas.addEventListener("pointerdown", (e) => {
  if (!cur) return;
  dragging = true;
  vas.setPointerCapture(e.pointerId);
  setVas(e.clientX);
});
vas.addEventListener("pointermove", (e) => { if (dragging) setVas(e.clientX); });
vas.addEventListener("pointerup", () => { dragging = false; });
vas.addEventListener("pointercancel", () => { dragging = false; });
vas.addEventListener("keydown", (e) => {
  if (!cur || cur.vas == null) return;
  const step = e.shiftKey ? 5 : 1;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    const rect = vas.getBoundingClientRect();
    const v = cur.vas + (e.key === "ArrowLeft" ? -step : step);
    setVas(rect.left + Math.max(0, Math.min(100, v)) / 100 * rect.width);
  }
});

/* ---------- trials ---------- */
function startTrial() {
  const t = trials[idx];
  const mainTotal = trials.filter(x => !x.practice).length;
  const mainIndex = trials.slice(0, idx + 1).filter(x => !x.practice).length;
  $("counter").textContent = t.practice ? T.practice : fmt(T.counter, { i: mainIndex, n: mainTotal });
  vas.classList.remove("answered");
  vas.removeAttribute("aria-valuenow");
  $("btn-next").disabled = true;
  patch.style.background = "var(--ground)";
  cur = null;
  show("s-trial");
  setTimeout(() => {
    patch.style.background = hex(t.color.rgb);
    cur = { onset: performance.now(), vas: null, rtFirst: null, nClicks: 0, timedOut: 0 };
    vas.focus({ preventScroll: true });
    if (CONFIG.TRIAL_TIMEOUT_MS > 0) {
      trialTimer = setTimeout(() => { if (cur) { cur.timedOut = 1; endTrial(); } }, CONFIG.TRIAL_TIMEOUT_MS);
    }
  }, CONFIG.ISI_MS);
}
function endTrial() {
  clearTimeout(trialTimer); trialTimer = null;
  const t = trials[idx];
  const c = t.color;
  session.rows.push({
    study_id: CONFIG.STUDY_ID,
    session_id: session.id,
    subject_code: session.subject,
    participant_id: session.pid,
    lang,
    practice: t.practice,
    trial: idx + 1,
    rep: t.rep,
    color_name: c.name,
    hue_deg: c.hue == null ? "" : c.hue,
    L_star: c.L, C_star: c.C,
    r: c.rgb[0], g: c.rgb[1], b: c.rgb[2],
    hex: hex(c.rgb),
    vas: cur.vas == null ? "" : cur.vas,
    timed_out: cur.timedOut,
    rt_first_ms: cur.rtFirst == null ? "" : cur.rtFirst,
    rt_submit_ms: Math.round(performance.now() - cur.onset),
    n_adjust: cur.nClicks,
    timestamp: new Date().toISOString(),
    ...session.device
  });
  sendTrial(session.rows[session.rows.length - 1]);
  idx++;
  if (idx < trials.length && !trials[idx].practice && !mainStarted) {
    mainStarted = true;
    $("s-main-intro").querySelector("[data-i18n='main1']").textContent =
      fmt(T.main1, { n: trials.filter(x => !x.practice).length });
    show("s-main-intro");
  } else if (idx < trials.length) {
    startTrial();
  } else {
    finish();
  }
}

/* ---------- network ---------- */
async function post(payload, timeoutMs = 10000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(CONFIG.ENDPOINT_URL, {
      method: "POST", body: JSON.stringify(payload),
      headers: { "Content-Type": "text/plain;charset=utf-8" }, signal: ctrl.signal
    });
    return await res.json();
  } finally { clearTimeout(timer); }
}
function sendTrial(row) {
  if (!CONFIG.ENDPOINT_URL) return;
  const cols = Object.keys(row);
  const p = post({ action: "trial", columns: cols, row: cols.map(k => row[k]) })
    .then(j => { if (!j || !j.ok) sendFailures++; })
    .catch(() => { sendFailures++; });
  pending.push(p);
}

/* ---------- finish + submit ---------- */
function columns() { return Object.keys(session.rows[0] || {}); }
function toCsv() {
  const cols = columns();
  const esc = (v) => {
    const s = v == null ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [cols.join(","), ...session.rows.map(r => cols.map(k => esc(r[k])).join(","))].join("\n");
}
async function finish() {
  show("s-done");
  $("code").textContent = session.subject ? `${session.subject}-${session.id}` : session.id;
  $("subject").textContent = session.subject || "—";
  const st = $("send-status");
  if (!CONFIG.ENDPOINT_URL) { st.textContent = T.offline; return; }
  st.textContent = T.sending;
  await Promise.all(pending);
  let finished = false;
  try {
    const j = await post({ action: "finish", session_id: session.id, n_trials: session.rows.length });
    finished = !!(j && j.ok);
  } catch (e) { /* fall through */ }
  if (sendFailures > 0 || !session.subject) st.textContent = T.partial;
  else st.textContent = finished ? T.sent : T.sentUnconfirmed;
}
$("btn-csv").addEventListener("click", () => {
  const blob = new Blob(["\uFEFF" + toCsv()], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${CONFIG.STUDY_ID}_${session.pid || "anon"}_${session.id}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
});

/* ---------- wiring ---------- */
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  applyLang(b.dataset.lang);
  show("s-consent");
}));
$("consent").addEventListener("change", () => { $("btn-consent").disabled = !$("consent").checked; });
$("btn-consent").addEventListener("click", () => {
  session.pid = $("pid").value.trim();
  show("s-screen");
});
$("btn-fs").addEventListener("click", () => {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
});
$("btn-screen").addEventListener("click", () => show("s-instr"));
$("btn-start").addEventListener("click", async () => {
  const btn = $("btn-start");
  btn.disabled = true;
  btn.textContent = T.preparing;
  session.device = deviceInfo();
  if (CONFIG.ENDPOINT_URL) {
    try {
      const j = await post({ action: "register", study_id: CONFIG.STUDY_ID, session_id: session.id,
                             participant_id: session.pid, lang, device: session.device });
      if (j && j.ok && j.subject_code) session.subject = j.subject_code;
    } catch (e) { /* no code: page continues, data still downloadable */ }
    if (!session.subject) sendFailures++;
  }
  btn.disabled = false;
  btn.textContent = T.startPractice;
  trials = buildSequence();
  idx = 0;
  startTrial();
});
$("btn-main").addEventListener("click", startTrial);
$("btn-restart").addEventListener("click", () => location.reload());
$("btn-next").addEventListener("click", () => { if (cur && cur.vas != null) endTrial(); });
</script>
